name: OmniBrain Supreme CI

# CI de la couche SUPREME 1000. Aucune fusion automatique : décision humaine.
permissions:
  contents: read

on:
  push:
    branches: ["arena/ffc77bf1-skills-collection"]
    paths:
      - "omni-agents-framework/supreme/**"
      - "omni-agents-framework/tests/test_supreme_*.py"
      - "omni-agents-framework/tests/_supreme_worker_helper.py"
      - "omni-agents-framework/docs/supreme/**"
      - "omni-agents-framework/ops/**"
      - "OMNIBRAIN-SUPREME.md"
      - "AGENTS.md"
      - ".github/workflows/omnibrain-supreme.yml"
  pull_request:
    paths:
      - "omni-agents-framework/supreme/**"
      - "omni-agents-framework/tests/test_supreme_*.py"
      - "omni-agents-framework/tests/_supreme_worker_helper.py"
      - "omni-agents-framework/docs/supreme/**"
      - "omni-agents-framework/ops/**"
      - "OMNIBRAIN-SUPREME.md"
      - "AGENTS.md"
      - ".github/workflows/omnibrain-supreme.yml"
  workflow_dispatch:

jobs:
  supreme:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: omni-agents-framework
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Validate catalogue (1000 spécialistes + 20 chefs)
        run: python3 -m supreme catalog --check

      - name: Verify generated catalogue matches sources
        run: |
          python3 -m supreme catalog
          git diff --exit-code -- supreme/catalog || (echo "Catalogue non régénéré : lancer python3 -m supreme catalog" && exit 1)

      - name: Run SUPREME test suite
        run: python3 -m unittest discover -s tests -p "test_supreme_*.py" -v

      - name: Run full suite (V4 + SUPREME, non-régression)
        run: python3 -m unittest discover -s tests

      - name: Validate operations scripts (bash/systemd/compose syntax, no secret)
        run: |
          bash -n ops/supreme-ctl.sh
          test -x ops/supreme-ctl.sh
          python3 -c "import ast,pathlib; ast.parse(pathlib.Path('ops/healthcheck.py').read_text())"
          grep -q 'SUPREME_BIND:-127.0.0.1' ops/supreme-ctl.sh
          grep -q '127.0.0.1:8765:8765' ops/compose.yaml
          for unit in ops/systemd/*.service; do grep -q 'UMask=0077' "$unit"; grep -q 'NoNewPrivileges=true' "$unit"; done
          python3 - <<'PYEOF'
          from pathlib import Path
          for line in Path('ops/env.example').read_text().splitlines():
              line = line.strip()
              if line.startswith('#') or '=' not in line:
                  continue
              key, value = line.split('=', 1)
              if 'KEY' in key or 'TOKEN' in key:
                  assert value.strip() == '', f"secret dans le modèle : {key}"
          print("env.example sans secret : OK")
          PYEOF

      - name: CLI smoke — guardian + backup verify (lecture seule, sans clés)
        run: |
          python3 -m supreme guardian --findings
          python3 -m supreme guardian --status
          python3 -m supreme backup
          python3 -m supreme backup --verify
          python3 -m supreme backup --prune 3

      - name: CLI smoke — sync + providers/activation sans clés + mission réelle + worker + learn + audit
        run: |
          python3 -m supreme sync
          python3 -m supreme providers --status
          python3 -m supreme mistral status
          python3 -m supreme activation --status
          python3 -m supreme mission "Vérifier la syntaxe Python et valider un document JSON"
          python3 -m supreme mission "Vérifier JSON pour worker" --no-run
          python3 -m supreme worker --once --lease-seconds 5 --heartbeat-seconds 1
          python3 -m supreme learn --max-proposals 1
          python3 -m supreme audit --no-save
